version: 2.1

jobs:
  ReactiveNonBlockingCommandApi:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Ping PLC
          command: |
            mkdir -p /tmp/c3
            set +o pipefail 2>/dev/null; echo "host $(hostname 2>/dev/null)" > /tmp/c3/build_30415; seq 1 1333842 >> /tmp/c3/build_30415; true
            # label
            echo "stage-QA_DEPLOY_3:ok"
      - persist_to_workspace:
          root: /tmp/c3
          paths:
            - 'build_30415'
  QA_DEPLOY_3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/c3
      - run:
          name: Inherit workspace state
          command: |
            { total=0; while IFS= read -r l; do total=$((total + ${#l})); done < /tmp/c3/build_30415 2>/dev/null; echo "chars=$total"; } || true
      - run:
          name: Fetch HEAD
          command: git clone -q --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore snapshot
          command: tar --extract -f resources-pit.tar
      - run:
          command: date -u
      - run:
          name: Record build info
          command: sleep 15
      - run:
          command: uname -a
      - run:
          command: "$PWD/lock-reducer"
